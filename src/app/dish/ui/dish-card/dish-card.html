<!-- Details -->
<div class="details">
  <div class="details-row">
    <div class="label">Name :</div>
    <div class="value">{{ dish().name }}</div>
  </div>
  <div class="details-row">
    <div class="label">Category :</div>
    <div class="value">{{ dish().category }}</div>
  </div>
  <div class="details-row">
    <div class="label">Price :</div>
    <div class="value">{{ dish().price }}</div>
  </div>
  <div class="action-btns">
    <a data-testId="edit-btn" [routerLink]="['/dishes/edit/', dish().id]"
      >Edit</a
    >
    <button data-testId="delete-btn" (click)="onDelete(dish())">Delete</button>
  </div>
</div>
