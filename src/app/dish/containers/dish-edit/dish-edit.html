<h1 class="page-title">Update dish # {{ dishId() }}</h1>
@if (dishRx.error()) {
  <div class="error-block">{{ errorMsg }}</div>
}
@if (dishRx.isLoading()) {
  <div class="loading-block">⏳ Loading...</div>
}
<div class="content-wrapper">
  @if (this.dishRx.hasValue()) {
    <app-dish-form
      (editDish)="onEditDish($event)"
      [dish]="this.dishRx.value()"
      [categories]="categories"
    />
  }
</div>
